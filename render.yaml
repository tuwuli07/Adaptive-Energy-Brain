services:
  - type: web
    name: adaptive-energy-brain
    runtime: python
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd .. && python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: python scripts/start_render.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
