  - id: campus_weather
    category: weather
    description: Optional weather covariates; measurement heights and irradiance plane remain unresolved.
    type: local_csv
    local_path: null
    download_url: null
    filename: campus_weather.csv
    expected_columns: [timestamp_utc, irradiance_w_m2, air_temperature_c, wind_speed_m_s]
    units:
      timestamp_utc: ISO 8601 UTC datetime
