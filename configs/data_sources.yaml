# Source-selection placeholders, not approved or measured datasets.
# Pending entries are skipped without network access or filesystem writes.
# Local paths, once selected, are relative to this configuration directory.
# To enable acquisition: select and review a CSV source, document its license,
# time conventions and original columns/units, then set status: verified.
# For type: http, set a verified download_url and local_path: null.
# For type: local_csv, set local_path and download_url: null.
# Expected columns below are provisional requirements, not claims about files.
# Acquisition preserves bytes; it does not enforce or transform column schemas.
# Optional sha256 may hold a publisher-provided 64-character SHA-256 digest.
sources:
  - id: campus_solar
    category: solar
    description: Solar generation / irradiance; direct available PV power preferred initially.
    type: local_csv
    local_path: null
    download_url: null
    filename: campus_solar.csv
    expected_columns: [timestamp_utc, pv_available_kw]
    units: {timestamp_utc: "ISO 8601 UTC datetime", pv_available_kw: "kW"}
    time_resolution: hourly
    time_zone: null
    license: null
    status: pending

  - id: campus_wind
